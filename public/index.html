<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlayRoom</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(135deg,#111827,#312e81);color:#fff;min-height:100vh}
main{max-width:720px;margin:auto;padding:22px 16px}.card{background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:20px;margin:12px 0}
h1{font-size:42px;margin:10px 0}h2{margin:5px 0 15px}.muted{color:#cbd5e1}.btn,input,select{width:100%;padding:14px;margin:7px 0;border-radius:13px;border:0;font-size:16px}.btn{background:#fff;color:#111827;font-weight:800}.btn.alt{background:#6366f1;color:white}.btn:disabled{opacity:.45}.row{display:flex;gap:8px}.row>*{flex:1}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);margin:4px}.big{font-size:52px}.item{font-size:26px;font-weight:800}.center{text-align:center}.danger{background:#ef4444;color:#fff}.success{background:#22c55e;color:#fff}.list button{margin:5px 0}.hide{display:none}.made{text-align:center;color:#cbd5e1;margin-top:22px}.game{border:1px solid rgba(255,255,255,.15);padding:14px;border-radius:15px;margin:8px 0}.game b{font-size:18px}
</style></head><body><main id="app"></main><script>
const app=document.querySelector("#app");let ws,me="",room="",host=false,state=null,priv=null;
function ui(s){app.innerHTML=s}function send(o){ws?.send(JSON.stringify(o))}
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="error")return alert(m.msg);if(m.type==="joined"){room=m.code;renderLobby()}if(m.type==="state"){state=m;host=state.host===meId;render()}if(m.type==="private"){priv=m;renderPrivate()}}}
let meId=null;
function home(){ui(`<div class="card center"><h1>🎮 PlayRoom</h1><p class="muted">Social games for people in the same room.</p><input id="name" placeholder="Your name" maxlength="20"><div class="row"><button class="btn alt" id="create">Create Room</button><button class="btn" id="join">Join Room</button></div><input id="code" placeholder="Room code" maxlength="10"><div class="made">Made by Abdullah Al-Dalki</div></div>`);connect();create.onclick=()=>{me=document.querySelector("#name").value.trim();if(!me)return alert("Enter your name");send({type:"create",name:me})};join.onclick=()=>{me=document.querySelector("#name").value.trim();const c=document.querySelector("#code").value.trim();if(!me||!c)return alert("Enter your name and room code");send({type:"join",name:me,code:c})}}
function renderLobby(){render()}
function render(){if(!state)return;let games=["Who Is The Imposter?","20 Questions","Silent Charades","Category Clash","Majority Rules","The Secret Clue","Word Chain"];ui(`<div class="card"><h1>PlayRoom</h1><div class="pill">Room: <b>${room}</b></div><h2>Players (${state.players.length})</h2><div>${state.players.map(p=>`<span class="pill">${p.name}${p.host?" 👑":""}</span>`).join("")}</div></div>${!state.game?`<div class="card"><h2>Choose a game</h2>${games.map(g=>`<div class="game"><b>${g}</b>${host?`<button class="btn alt" onclick="start('${g}')">Start</button>`:"<p class='muted'>Waiting for host…</p>"}</div>`).join("")}</div>`:`<div id="game" class="card"><h2>${state.game}</h2><p class="muted">Loading game…</p></div>`}<div class="made">Made by Abdullah Al-Dalki</div>`);renderPrivate()}
function start(g){let extra={type:"start",game:g};if(g==="Who Is The Imposter?")extra.category=prompt("Category: Food, Animals, Objects, Things, Sports","Food")||"Food";send(extra)}
function renderPrivate(){const box=document.querySelector("#game");if(!box||!priv)return;let s="";
if(priv.game==="Who Is The Imposter?"){if(priv.phase==="secret")s=priv.role==="imposter"?`<div class=center><div class=big>🕵️</div><h2>You are the IMPOSTER</h2><p>Category: ${priv.category}</p><p>You do not know the secret item.</p></div>`:`<div class=center><div class=big>${priv.item.emoji}</div><div class=item>${priv.item.word}</div><p>Category: ${priv.category}</p></div><button class="btn alt" onclick="send({type:'nextSecret'})">Everyone ready</button>`;
else if(priv.phase==="questioning")s=`<p>Current player: <b>${priv.turn}</b></p><p>Ask questions out loud, then tap Next Turn.</p><button class="btn alt" onclick="send({type:'nextTurn'})">Next Turn</button><h3>Vote when everyone has asked.</h3>${state.players.map(p=>`<button class="btn" onclick="send({type:'vote',target:'${p.id}'})">Vote ${p.name}</button>`).join("")}`;
else if(priv.phase==="result")s=`<h3>The impostor was revealed!</h3><p>Host can restart.</p>${host?`<button class="btn alt" onclick="send({type:'restart'})">Back to Lobby</button>`:""}`;
}
else if(priv.game==="20 Questions")s=priv.phase==="questions"?`<p>Current player: <b>${priv.turn}</b></p><input id="q" placeholder="Ask a Yes/No question"><button class="btn alt" onclick="send({type:'question',text:q.value});q.value=''">Submit Question</button>`:`<h3>Questions finished!</h3>`;
else if(priv.game==="Silent Charades")s=priv.actor?`<div class=center><div class=big>🎭</div><p>Act this:</p><div class=item>${priv.item.word} ${priv.item.emoji}</div></div>`:`<p>Watch the actor silently. Then enter your guess.</p><input id="g" placeholder="Your guess"><button class="btn alt" onclick="send({type:'charadeGuess',word:g.value})">Guess</button>`;
else if(priv.game==="Category Clash")s=`<p>Category: <b>${priv.category}</b></p><input id="a" placeholder="Your answer"><button class="btn alt" onclick="send({type:'answer',text:a.value})">Submit</button>`;
else if(priv.game==="Majority Rules")s=priv.phase==="vote"?`<h3>${priv.question}</h3><button class="btn alt" onclick="send({type:'majorityVote',choice:'Option A'})">Option A</button><button class="btn" onclick="send({type:'majorityVote',choice:'Option B'})">Option B</button>`:`<h3>Results</h3>`;
else if(priv.game==="The Secret Clue")s=`${priv.isBluffer?`<p>🤫 You are the bluffer. You don't know the secret.</p>`:`<div class=item>${priv.item.word} ${priv.item.emoji}</div>`}<input id="c" placeholder="Give a short clue"><button class="btn alt" onclick="send({type:'clue',text:c.value})">Submit clue</button>`;
else if(priv.game==="Word Chain")s=`<p>Current word: <span class=item>${priv.current}</span></p><p>Next player: ${state.players[state.players.findIndex(x=>x.id===state.players.find(x=>x.name===priv.current)?.id)]?.name||"take turns"}</p><input id="w" placeholder="Related word"><button class="btn alt" onclick="send({type:'chain',word:w.value})">Play Word</button>`;
box.innerHTML=`<h2>${priv.game}</h2>${s}`;
}
home();
</script></main></body></html>
